name: UI Consolidation

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/ui-consolidation.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Profile and League UI
        run: node scripts/ui-consolidation.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Profile.tsx src/pages/League.tsx
          git commit -m "[ui consolidation] Surface trophies and championship points"
          git push origin HEAD:agent/competitive-loop-foundation
