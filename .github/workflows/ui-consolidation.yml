name: UI Consolidation

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/ui-consolidation.trigger

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui consolidation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0

      - name: Patch Profile and League UI
        shell: python
        run: |
          from pathlib import Path

          profile = Path('src/pages/Profile.tsx')
          text = profile.read_text()
          old = "import { useDeleteLeague, useLeaveLeague } from '@/hooks/useLeagueActions';\n"
          new = old + "import { TrophyCase } from '@/components/profile/TrophyCase';\n"
          assert old in text and "TrophyCase" not in text
          text = text.replace(old, new, 1)

          old_cards = """        {
          icon: Target,
          label: 'Week Points',
          value: currentMember?.weekly_points?.toLocaleString() ?? '0',
          subtext: 'Current scoring week',
        },
        {
          icon: Award,
          label: 'Season Points',
          value: currentMember?.total_points?.toLocaleString() ?? '0',
          subtext: 'Cumulative total',
        },"""
          new_cards = """        {
          icon: Target,
          label: 'Week Raw Points',
          value: currentMember?.weekly_points?.toLocaleString() ?? '0',
          subtext: 'Current weekly race',
        },
        {
          icon: Award,
          label: 'Championship Points',
          value: currentMember?.championship_points?.toLocaleString() ?? '0',
          subtext: `${currentMember?.total_points?.toLocaleString() ?? '0'} raw season pts`,
        },"""
          assert old_cards in text
          text = text.replace(old_cards, new_cards, 1)

          marker = "        <section className=\"card-elevated rounded-xl p-4\">\n"
          trophy = """        <TrophyCase
          userId={user?.id}
          seasonId={league?.current_season?.id}
          wins={currentMember?.wins ?? 0}
          currentStreak={currentMember?.current_streak ?? 0}
          streakType={currentMember?.streak_type}
        />

"""
          assert marker in text
          text = text.replace(marker, trophy + marker, 1)
          profile.write_text(text)

          league = Path('src/pages/League.tsx')
          text = league.read_text()
          old_sort = "      return b.total_points - a.total_points || b.weekly_points - a.weekly_points;"
          new_sort = "      return b.championship_points - a.championship_points || b.total_points - a.total_points || b.weekly_points - a.weekly_points;"
          assert old_sort in text
          text = text.replace(old_sort, new_sort, 1)

          old_avatar = """    if (member?.avatar_url) {
      return <img src={member.avatar_url} alt={member.display_name || 'Player'} className=\"w-full h-full object-cover\" />;
    }
    return <span>{member?.display_name?.charAt(0).toUpperCase() || getDefaultAvatar(rank)}</span>;"""
          new_avatar = """    if (member?.avatar_url) {
      if (member.avatar_url.startsWith('http://') || member.avatar_url.startsWith('https://')) {
        return <img src={member.avatar_url} alt={member.display_name || 'Player'} className=\"w-full h-full object-cover\" />;
      }
      return <span className=\"text-xl\">{member.avatar_url}</span>;
    }
    return <span>{member?.display_name?.charAt(0).toUpperCase() || getDefaultAvatar(rank)}</span>;"""
          assert old_avatar in text
          text = text.replace(old_avatar, new_avatar, 1)

          old_score = "    seasonScore: member.total_points,"
          new_score = "    seasonScore: isLeaderboard ? member.championship_points : member.total_points,"
          assert old_score in text
          text = text.replace(old_score, new_score, 1)

          old_title = "              {isActive ? 'Season Standings' : 'League Members'}"
          new_title = "              {isActive ? (isLeaderboard ? 'Season Championship' : 'Season Standings') : 'League Members'}"
          assert old_title in text
          text = text.replace(old_title, new_title, 1)
          league.write_text(text)

      - name: Clean up one-time workflow and commit
        run: |
          rm -f .github/ui-consolidation.trigger .github/workflows/ui-consolidation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ui consolidation] Surface trophies and championship points"
          git push origin HEAD:agent/competitive-loop-foundation
