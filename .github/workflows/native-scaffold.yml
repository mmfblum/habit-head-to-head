name: Native App Scaffold

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - capacitor.config.json

permissions:
  contents: write

jobs:
  scaffold:
    if: ${{ !contains(github.event.head_commit.message, '[native scaffold]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing dependencies
        run: npm ci

      - name: Add stable Capacitor 8
        run: |
          npm install --save-exact @capacitor/core@8.4.2 @capacitor/android@8.4.2 @capacitor/ios@8.4.2
          npm install --save-dev --save-exact @capacitor/cli@8.4.2
          npm pkg set scripts.native:sync="npm run build && npx cap sync"
          npm pkg set scripts.native:android="npm run native:sync && npx cap open android"
          npm pkg set scripts.native:ios="npm run native:sync && npx cap open ios"

      - name: Build web app
        run: npm run build

      - name: Generate native projects
        run: |
          npx cap add android
          npx cap add ios
          npx cap sync

      - name: Commit generated native shells
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json capacitor.config.json android ios
          git commit -m "[native scaffold] Add Capacitor iOS and Android shells"
          git push origin HEAD:agent/competitive-loop-foundation
