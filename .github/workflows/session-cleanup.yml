name: Session Cleanup

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/session-cleanup.trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0
      - name: Remove one-time engineering helpers
        run: |
          rm -f \
            .github/workflows/branch-validation.yml \
            .github/branch-validation.trigger \
            .github/workflows/consequence-ui.yml \
            .github/consequence-ui.trigger \
            scripts/consequence-ui.mjs \
            .github/workflows/native-scaffold.yml \
            .github/workflows/native-share-plugin.yml \
            .github/native-share-plugin.trigger \
            .github/workflows/product-polish.yml \
            .github/product-polish.trigger \
            scripts/product-polish.mjs \
            .github/workflows/recap-ui.yml \
            .github/recap-ui.trigger \
            scripts/recap-ui.mjs \
            .github/workflows/solo-ui.yml \
            .github/solo-ui.trigger \
            scripts/solo-ui.mjs \
            .github/workflows/session-cleanup.yml \
            .github/session-cleanup.trigger
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean one-time engineering workflows"
          git push origin HEAD:agent/competitive-loop-foundation
