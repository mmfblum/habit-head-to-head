name: Product Polish

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/product-polish.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply product polish
        run: node scripts/product-polish.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Tasks.tsx src/components/league/CreateLeagueWizard.tsx
          git commit -m "[product polish] Add quick card finish and deep invites"
          git push origin HEAD:agent/competitive-loop-foundation
