name: Recap UI Integration

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/recap-ui.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/recap-ui.mjs
      - name: Commit recap UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.tsx
          if ! git diff --cached --quiet; then
            git commit -m "[recap] Show weekly game recap on Home"
          fi
          git pull --rebase origin agent/competitive-loop-foundation
          git push origin HEAD:agent/competitive-loop-foundation
