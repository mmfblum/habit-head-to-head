name: Consequence UI Integration

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/consequence-ui.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/consequence-ui.mjs
      - name: Commit consequence UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/League.tsx
          git commit -m "[consequences] Add Leaderboard wheel and custom settings"
          git push origin HEAD:agent/competitive-loop-foundation
