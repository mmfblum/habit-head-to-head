name: Solo UI Integration

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/solo-ui.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate Solo mode
        run: node scripts/solo-ui.mjs
      - name: Commit Solo UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "[solo] Add Solo mode and accountability sharing UI"
          git push origin HEAD:agent/competitive-loop-foundation
