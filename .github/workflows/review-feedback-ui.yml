name: Apply review feedback UI

on:
  push:
    branches:
      - agent/competitive-loop-foundation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply product patch
        run: |
          printf '\n' >> src/hooks/useLeagues.ts
          python3 scripts/apply_review_feedback_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/League.tsx')
          text = p.read_text()
          bad = '''    </div>\n       {showCreateLeague && <CreateLeagueWizard onClose={() => setShowCreateLeague(false)} />}\n    </div>\n  );\n}\n'''
          good = '''      {showCreateLeague && <CreateLeagueWizard onClose={() => setShowCreateLeague(false)} />}\n    </div>\n  );\n}\n'''
          if bad not in text:
              raise SystemExit('Expected League.tsx placement pattern not found')
          p.write_text(text.replace(bad, good, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Remove one-time patch machinery
        run: rm scripts/apply_review_feedback_ui.py .github/workflows/review-feedback-ui.yml

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply first hands-on review feedback"
          git push origin HEAD:agent/competitive-loop-foundation
