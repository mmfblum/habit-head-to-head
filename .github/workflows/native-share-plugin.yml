name: Native Share Plugin

on:
  push:
    branches:
      - agent/competitive-loop-foundation
    paths:
      - .github/native-share-plugin.trigger

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/competitive-loop-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add Capacitor Share
        run: |
          npm install --save-exact @capacitor/share@8.0.1
          npx cap sync
      - name: Commit native share support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android ios
          git commit -m "[native share] Add Capacitor Share plugin"
          git push origin HEAD:agent/competitive-loop-foundation
